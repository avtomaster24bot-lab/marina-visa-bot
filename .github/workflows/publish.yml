name: Marina Smart Auto Poster

on:
  workflow_dispatch:

  schedule:
    - cron: "0 5 * * *"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-poster.txt

      - name: Run smart poster
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: |
          python smart_poster.py

      - name: Upload social package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marina-social-package
          path: generated/
          retention-days: 7
